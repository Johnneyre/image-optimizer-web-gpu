<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" fill="none">
  <defs>
    <path id="bolt" d="M70 1 L37 61 H59 L44.5 105 L82.5 46 H62.5 Z"/>

    <!-- Cuerpo: cian arriba -> azul eléctrico abajo -->
    <linearGradient id="boltBody" x1="70" y1="1" x2="44" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#45E5F2"/>
      <stop offset="0.35" stop-color="#00E2FF"/>
      <stop offset="0.7" stop-color="#008CF0"/>
      <stop offset="1" stop-color="#0078FF"/>
    </linearGradient>

    <!-- Sombreado diagonal: transparente a la izquierda -> azul marino a la derecha -->
    <linearGradient id="boltShade" x1="56" y1="40" x2="84" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#043067" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#0A3F80" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#03306E" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Sombra de los bordes inferiores-derechos -->
    <linearGradient id="boltShadow" x1="0" y1="1" x2="0" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D5C92"/>
      <stop offset="0.45" stop-color="#0B4084"/>
      <stop offset="1" stop-color="#00306E"/>
    </linearGradient>

    <!-- Brillo: borde superior-izquierdo iluminado -->
    <linearGradient id="boltLight" x1="0" y1="1" x2="0" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2FDFF"/>
      <stop offset="0.25" stop-color="#7FF4FF"/>
      <stop offset="1" stop-color="#3FD9F0"/>
    </linearGradient>

    <!-- Banda visible solo junto a los bordes inferiores-derechos -->
    <mask id="shadowBand" maskUnits="userSpaceOnUse" x="0" y="0" width="112" height="112">
      <use href="#bolt" fill="#fff"/>
      <use href="#bolt" fill="#000" transform="translate(-3 -1.1)"/>
    </mask>
    <!-- Banda visible solo junto a los bordes superiores-izquierdos -->
    <mask id="lightBand" maskUnits="userSpaceOnUse" x="0" y="0" width="112" height="112">
      <use href="#bolt" fill="#fff"/>
      <use href="#bolt" fill="#000" transform="translate(1.8 0.7)"/>
    </mask>
  </defs>

  <!-- Marco: esquina superior izquierda (cian) -->
  <path d="M10 10 H54 V20 H20 V66 H10 Z" fill="#00EAFF"/>
  <!-- Marco: esquina inferior derecha (azul) -->
  <path d="M102 102 H58 V92 H92 V46 H102 Z" fill="#0078FF"/>

  <!-- Píxeles dispersos: grupo superior derecho -->
  <rect x="99" y="1" width="12" height="12" fill="#00EAFF"/>
  <rect x="76" y="12" width="12" height="12" fill="#00EAFF"/>
  <rect x="88" y="24" width="12" height="12" fill="#0078FF"/>

  <!-- Píxeles dispersos: grupo inferior izquierdo -->
  <rect x="12" y="76" width="12" height="12" fill="#00EAFF"/>
  <rect x="24" y="88" width="12" height="12" fill="#00CFF0"/>
  <rect x="1" y="99" width="12" height="12" fill="#0078FF"/>

  <!-- Rayo: cuerpo + sombreado diagonal + bandas de sombra y brillo -->
  <use href="#bolt" fill="url(#boltBody)"/>
  <use href="#bolt" fill="url(#boltShade)"/>
  <use href="#bolt" fill="url(#boltShadow)" mask="url(#shadowBand)"/>
  <use href="#bolt" fill="url(#boltLight)" mask="url(#lightBand)"/>
</svg>
