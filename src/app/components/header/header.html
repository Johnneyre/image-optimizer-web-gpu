<header
  class="h-(--header-height)"
  [class]="
    scrolled()
      ? 'transition-all duration-300 ease border-b border-[oklch(from_var(--border)_l_c_h/0.6)] bg-[oklch(from_var(--background)_l_c_h/0.8)] backdrop-blur-md'
      : 'transition-all duration-300 ease border-b border-transparent bg-transparent'
  "
>
  <div
    class="max-w-7xl ml-[calc((100vw-min(80rem,100vw))/2)] h-full px-4 sm:px-6 lg:px-8 flex items-center justify-between"
  >
    <div class="flex items-center gap-3">
      <img src="logo.svg" alt="" width="36" height="36" class="w-9 h-9" />
      <div>
        <p class="m-0 text-lg font-semibold text-(--foreground) transition-colors duration-300">
          WebGPU Image Optimizer
        </p>
        <p class="m-0 text-xs text-(--muted-foreground) transition-colors duration-300">
          Procesamiento local en GPU
        </p>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <!-- GPU Status -->
      @if (isInitializing()) {
        <div class="flex items-center gap-2 text-sm text-(--muted-foreground)">
          <lucide-icon
            [img]="icons.LoaderCircle"
            [size]="16"
            [strokeWidth]="2"
            class="animate-[spin_1s_linear_infinite]"
          />
          <span class="hidden sm:inline">Inicializando WebGPU...</span>
        </div>
      } @else if (isSupported() === false) {
        <div class="flex items-center gap-2 text-sm text-(--warning)">
          <lucide-icon
            [img]="icons.CircleAlert"
            [size]="16"
            [strokeWidth]="2"
            class="text-(--warning)"
          />
          <span class="hidden sm:inline">WebGPU no soportado</span>
        </div>
      } @else if (adapterInfo()) {
        <div
          class="hidden md:flex items-center gap-1.5 py-1.5 px-3 rounded-lg border border-(--border) bg-(--muted)/40 font-mono text-xs text-(--muted-foreground) transition-colors duration-300"
        >
          <lucide-icon [img]="icons.Gpu" [size]="14" [strokeWidth]="2" class="text-(--primary)" />
          <span>{{ adapterInfo() }}</span>
        </div>
      }

      <!-- Theme Toggle -->
      <button
        class="flex items-center justify-center w-11 h-11 lg:w-10 lg:h-10 rounded-lg border-0 bg-transparent text-(--muted-foreground) cursor-pointer transition-all duration-200 ease hover:bg-(--muted)/50 hover:text-(--foreground) focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-(--ring) touch-manipulation"
        (click)="onToggleTheme()"
        [title]="theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        [attr.aria-label]="theme() === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      >
        <lucide-icon
          [img]="theme() === 'dark' ? icons.Sun : icons.Moon"
          [size]="20"
          [strokeWidth]="2"
          aria-hidden="true"
        />
      </button>
    </div>
  </div>
</header>
