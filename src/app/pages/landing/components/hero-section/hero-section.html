<section class="hero-section">
  <div class="hero-content">
    <!-- Title -->
    <h1 class="hero-title">
      Optimiza tus imágenes
      <span class="hero-title-gradient">en segundos</span>
    </h1>

    <!-- Subtitle -->
    <p class="hero-subtitle">
      Un optimizador de imágenes que corre enteramente en tu navegador usando
      <span class="hero-subtitle-highlight">WebGPU</span>. Reduce el tamaño de tus imágenes hasta un
      80% sin comprometer la calidad — y sin enviar un solo byte a un servidor.
    </p>

    <!-- Features list -->
    <div class="hero-features">
      <span class="hero-feature-item">
        <lucide-icon [img]="icons.Zap" [size]="16" />
        <span>Procesamiento en segundos</span>
      </span>
      <span class="hero-feature-dot"></span>
      <span class="hero-feature-item">
        <lucide-icon [img]="icons.Lock" [size]="16" />
        <span>100% local y privado</span>
      </span>
      <span class="hero-feature-dot"></span>
      <span class="hero-feature-item">
        <lucide-icon [img]="icons.Sparkles" [size]="16" />
        <span>WebP · JPEG · PNG</span>
      </span>
    </div>
  </div>
</section>
