<footer
  class="footer-section border-t border-[oklch(from_var(--border)_l_c_h/0.6)] bg-[oklch(from_var(--background)_l_c_h/0.6)] transition-colors duration-300 ease"
>
  <div
    class="max-w-7xl mx-auto py-6 px-4 flex flex-col items-center justify-between gap-4 sm:flex-row sm:px-6 lg:px-8"
  >
    <!-- Brand -->
    <div class="flex items-center gap-2.5">
      <img src="logo.svg" alt="" width="28" height="28" class="w-7 h-7" />
      <div>
        <p class="m-0 text-sm font-medium text-(--foreground)">WebGPU Image Optimizer</p>
        <p class="m-0 text-xs text-(--muted-foreground)">Procesamiento 100% local</p>
      </div>
    </div>

    <!-- Links + Copyright -->
    <div class="flex flex-col items-center gap-2 sm:items-end">
      <button
        type="button"
        (click)="termsOpen.set(true)"
        class="m-0 text-xs text-(--muted-foreground) bg-transparent border-0 cursor-pointer transition-colors hover:text-(--foreground) underline-offset-4 hover:underline focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-(--ring) rounded"
      >
        Términos y Condiciones
      </button>
      <p class="m-0 text-xs text-(--muted-foreground) text-center sm:text-right">
        © {{ currentYear }} WebGPU Image Optimizer. Todos los derechos reservados.
      </p>
    </div>
  </div>
</footer>

<!-- Terms & Conditions Modal -->
<app-terms-modal [open]="termsOpen()" (closed)="termsOpen.set(false)" />
