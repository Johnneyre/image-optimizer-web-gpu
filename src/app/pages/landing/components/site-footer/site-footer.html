<footer

>
  <div
    class="max-w-7xl mx-auto py-6 px-4 flex flex-col items-center justify-between gap-4 sm:flex-row sm:px-6 lg:px-8"
  >
    <!-- Brand -->
    <div class="flex items-center gap-2.5">
      <img src="logo.svg" alt="" width="28" height="28" class="w-7 h-7" />
      <div>
        <p class="m-0 text-sm font-medium text-(--foreground)">ImageOptimize</p>
        <p class="m-0 text-xs text-(--muted-foreground)">Procesamiento 100% local</p>
      </div>
    </div>

    <!-- Copyright -->
    <p class="m-0 text-xs text-(--muted-foreground)">
      © {{ currentYear }} ImageOptimize. Todos los derechos reservados.
    </p>
  </div>
</footer>
