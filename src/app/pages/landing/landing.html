<main
  id="main-content"
  class="landing-page min-h-dvh -mt-(--header-height) overflow-x-hidden"
  [class.dark]="theme() === 'dark'"
>
  <!-- Unified hero + upload background (extends under the transparent sticky header) -->
  <div class="landing-hero-area relative isolate pt-(--header-height) pb-16">
    <!-- Background grid -->
    <div class="landing-grid-bg" aria-hidden="true"></div>

    <!-- Ambient glows -->
    <div class="landing-glow landing-glow-center" aria-hidden="true"></div>
    <div class="landing-glow landing-glow-right" aria-hidden="true"></div>
    <div class="landing-glow landing-glow-left" aria-hidden="true"></div>

    <!-- Hero Section -->
    <app-hero-section />

    <!-- Upload Zone -->
    <app-upload-zone (fileSelected)="onFileSelected($event)" />

    <!-- Stats Section -->
    <app-stats-section />
  </div>

  <!-- How It Works Section -->
  @defer (on viewport) {
    <app-how-it-works />
  } @placeholder {
    <div class="min-h-[500px]"></div>
  }

  <!-- Footer -->
  <app-site-footer />
</main>
